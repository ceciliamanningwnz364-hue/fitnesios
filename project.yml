name: bycreep
options:
  bundleIdPrefix: com.bycreep
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_COMPILATION_MODE: wholemodule
targets:
  bycreep:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - bycreepApp.swift
          - Models.swift
          - Theme.swift
          - Calc.swift
          - ImageStore.swift
          - PlanGenerator.swift
          - Components.swift
          - WorkoutsView.swift
          - NutritionView.swift
          - ProgressTab.swift
          - ProfileView.swift
          - Shared.swift
    dependencies:
      - target: bycreepWidget
    entitlements:
      path: bycreep.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bycreep.app]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: bycreep
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Камера нужна для фото прогресса
        NSPhotoLibraryUsageDescription: Галерея нужна для фото прогресса
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app
        CODE_SIGN_STYLE: Automatic
  bycreepWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes:
          - BycreepWidget.swift
          - Shared.swift
    entitlements:
      path: bycreepWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bycreep.app]
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: bycreep
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app.widget
        SKIP_INSTALL: yes
